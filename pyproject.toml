[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-contract-0910033-007"
version = "0.2.0"
description = "监管冻结解冻流程：领域契约、条件化额度冻结服务与 HTTP API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
freeze-server = "freeze_service.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
